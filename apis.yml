aid: digbi-health
name: Digbi Health
description: >-
  Digbi Health is a digital therapeutics company delivering a precision-biology virtual
  clinic for food-related and inflammatory illnesses — obesity, cardiometabolic disease,
  type 2 diabetes, digestive disorders (IBS, GERD), MSK chronic pain, PCOS, sleep and
  mental health. Its FoodRx program combines host-genetics and gut-microbiome testing
  with app-based coaching, precision nutrition, and pre/probiotic therapies, delivered
  to members through health plans and employers. Digbi Health is backed by Accel. The
  company operates a consumer-facing storefront and member app rather than a public
  developer API; this profile captures the public web, agent, and security surfaces
  observable at digbihealth.com.
